name: Daily GitHub Activity Digest

on:
  schedule:
    # Runs at 08:00 UTC every weekday (Monday-Friday)
    # - cron: '0 8 * * 1-5'
  workflow_dispatch:
    # Allows you to trigger the workflow manually for testing

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GitHub Activity Monitor
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          TARGET_ORG: ${{ vars.TARGET_ORG || '' }}
          DAYS_BACK: ${{ vars.DAYS_BACK || '1' }}
        run: python monitor.py
